# JVM unit tests only. Do not add connectedAndroidTest / installDebug here:
# those reinstall the debug app and wipe wallet data on a device/emulator.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Point Android Gradle Plugin at the runner SDK
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
